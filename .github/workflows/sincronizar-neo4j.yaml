name: Sincronizar Neo4j

# Copia o catálogo, os favoritos (Postgres) e as regras do check-up para o
# Neo4j do check-up da rotina. Só manual (Actions > Sincronizar Neo4j > Run
# workflow): rode depois de mudar o catálogo de produtos ou as regras do SDK.
# Não é agendado de propósito — o Neo4j é refeito a cada execução.

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente cujos segredos (Postgres e Neo4j) serão usados"
        type: choice
        options: [qa, production]
        default: qa

permissions:
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # O SDK da mesma tag que a API usa, com o extra neo4j: as regras vêm
      # empacotadas nele.
      - name: Instalar dependências
        run: python -m pip install --upgrade pip && python -m pip install -r venus_api/requirements.txt

      - name: Sincronizar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python -m venus_sdk.checkup.sincronizar
