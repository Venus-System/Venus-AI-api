name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r venus_api/requirements-dev.txt

      # O SDK vem do requirements.txt (por tag), nunca de um checkout editável:
      # é a versão que vai para produção que os testes exercitam.
      - name: Show installed SDK version
        run: python -c "import venus_sdk; print('venus-ai-sdk', venus_sdk.__version__)"

      - name: Run tests
        run: python -m pytest
