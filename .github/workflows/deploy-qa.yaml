name: Validate Venus AI and deploy via EC2 poller

on:
  push:
    branches: [develop]
  workflow_dispatch:

# A EC2 v2 já existente sincroniza origin/develop por um timer local.
# Não usamos OIDC, chaves AWS nem recursos AWS adicionais nesta conta Lab.
permissions:
  contents: read

concurrency:
  group: venus-ai-develop-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Testar e validar imagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r venus_api/requirements-dev.txt

      - name: Executar testes
        run: python -m pytest

      - name: Validar imagem Docker
        run: docker build --tag venus-ai:ci .

      - name: Validar arquivos do deploy sem custo
        run: |
          test -f deploy/venus-ai-deploy-check.sh
          test -f deploy/venus-ai-deploy-poller.service
          test -f deploy/venus-ai-deploy-poller.timer

  deploy:
    name: Entregar para o poller da EC2 v2
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar sincronização automática
        run: |
          echo "Validação concluída para $GITHUB_SHA."
          echo "A EC2 v2 monitora origin/develop pelo venus-ai-deploy-poller.timer."
          echo "Quando o merge chegar em develop, o serviço local inicia o deploy em até 1 minuto."
          echo "Nenhuma credencial AWS nem recurso AWS adicional é usado pelo workflow."
